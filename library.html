<!-- brauns-novel-cms/library.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitaplığım | Braun Novel</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .library-section { padding: 40px 0; }
    .section-title { margin-bottom: 20px; font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    
    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .card p { font-size: 0.85rem; opacity: 0.7; margin-bottom: 15px; }

    /* Toast Stili */
    .bn-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2000;
    }
    .bn-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">Braun Novel</a>
      <div>
        <a href="index.html" class="btn">Ana Sayfa</a>
        <button id="themeToggle" class="btn">🌙 Mode</button>
      </div>
    </div>
  </header>

  <main class="container library-section">
    <!-- Son Okunanlar / Kaldığım Yer -->
    <h2 class="section-title">⏱️ Kaldığım Yer</h2>
    <div id="progressList" class="grid-list">
      <!-- JavaScript Dinamik Dolduracak -->
    </div>

    <!-- Favorilerim -->
    <h2 class="section-title">♥ Favorilerim</h2>
    <div id="favoritesList" class="grid-list">
      <!-- JavaScript Dinamik Dolduracak -->
    </div>
  </main>

  <script src="js/reader.js"></script>
  <script src="js/library.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Okuma Geçmişini Yükle
      const progressList = document.getElementById("progressList");
      const progress = JSON.parse(localStorage.getItem("bn_progress")) || {};
      
      if (Object.keys(progress).length === 0) {
        progressList.innerHTML = "<p>Henüz okumaya başladığınız bir bölüm yok.</p>";
      } else {
        progressList.innerHTML = Object.keys(progress).map(id => {
          const item = progress[id];
          return `
            <div class="card">
              <div>
                <h3>${item.chapterTitle}</h3>
                <p>Son Okuma: ${item.lastReadAt}</p>
              </div>
              <a href="${item.chapterUrl}" class="btn btn-primary" style="text-align:center;">Okumaya Devam Et &raquo;</a>
            </div>
          `;
        }).join("");
      }

      // 2. Favorileri Yükle
      const favoritesList = document.getElementById("favoritesList");
      const favorites = JSON.parse(localStorage.getItem("bn_favorites")) || {};

      if (Object.keys(favorites).length === 0) {
        favoritesList.innerHTML = "<p>Henüz favorilerinize roman eklemediniz.</p>";
      } else {
        favoritesList.innerHTML = Object.keys(favorites).map(id => {
          const item = favorites[id];
          return `
            <div class="card">
              <div>
                <h3>${item.title}</h3>
                <p>Ekleme Tarihi: ${item.addedAt}</p>
              </div>
              <a href="index.html" class="btn">Seri Detayları</a>
            </div>
          `;
        }).join("");
      }
    });
  </script>
</body>
</html>
